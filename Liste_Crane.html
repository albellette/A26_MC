<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Crâne — Ressources Vidéo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #1c1a19;
            color: #f0e9df;
            padding: 40px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .nav-menu {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #3a3532;
        }

        .nav-menu a {
            color: #9c8f88;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .nav-menu a:hover {
            color: #f0e9df;
            background: #3a3532;
        }

        .nav-menu a.active {
            color: #948294;
            font-weight: 700;
        }

        header {
            margin-bottom: 40px;
            border-bottom: 2px solid #948294;
            padding-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            color: #f0e9df;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9c8f88;
            font-size: 14px;
            font-weight: 400;
        }

        .player-section {
            margin-bottom: 50px;
            background: #2c2926;
            border: 1px solid #3a3532;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(148, 130, 148, 0.1);
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #1c1a19;
            overflow: hidden;
        }

        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-info {
            padding: 24px;
            background: #2c2926;
        }

        .player-title {
            font-size: 20px;
            font-weight: 700;
            color: #f0e9df;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .player-meta {
            font-size: 13px;
            color: #9c8f88;
        }

        .thumbnails-section {
            margin-top: 40px;
        }

        .thumbnails-title {
            font-size: 16px;
            font-weight: 700;
            color: #f0e9df;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .thumbnails-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        .thumbnail-card {
            cursor: pointer;
            background: #2c2926;
            border: 2px solid #3a3532;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
        }

        .thumbnail-card:hover {
            border-color: #948294;
            box-shadow: 0 4px 12px rgba(148, 130, 148, 0.2);
            transform: translateY(-2px);
        }

        .thumbnail-card.active {
            border-color: #948294;
            background: #3a3532;
            box-shadow: 0 0 16px rgba(148, 130, 148, 0.3);
        }

        .thumbnail-image {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            overflow: hidden;
            background: #1c1a19;
        }

        .thumbnail-image img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumbnail-number {
            position: absolute;
            top: 6px;
            left: 6px;
            background: #948294;
            color: #1c1a19;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
        }

        .thumbnail-info {
            padding: 12px;
            background: #2c2926;
        }

        .thumbnail-title {
            font-size: 11px;
            color: #f0e9df;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        footer {
            margin-top: 80px;
            padding-top: 30px;
            border-top: 1px solid #3a3532;
            text-align: center;
            font-size: 12px;
            color: #6b645c;
        }

        @media (max-width: 768px) {
            .thumbnails-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-menu">
            <a href="index.html">← Accueil</a>
            <a href="Squelette.html">Squelette</a>
            <a href="Liste_Crane.html" class="active">Crâne</a>
            <a href="Les_Muscles.html">Muscles</a>
            <a href="La_peau_et_finaliser_le_modele.html">Peau & Finalisation</a>
            <a href="La_topologie.html">Topologie</a>
            <a href="Deploiement_UV.html">Déploiement UV</a>
            <a href="Projection_et_textures.html">Projection</a>
        </div>

        <header>
            <h1>Le Crâne</h1>
            <p class="subtitle">Structure du crâne et anatomie</p>
        </header>

        <div class="player-section">
            <div class="player-wrapper">
                <iframe id="mainPlayer" width="560" height="315" src="https://www.youtube.com/embed/aLAzKbbahgk" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>
            <div class="player-info">
                <div class="player-title" id="playerTitle">Crane Partie supérieur P1</div>
                <div class="player-meta"><span id="playerDuration">Cliquez sur une vidéo pour la lancer</span></div>
            </div>
        </div>

        <div class="thumbnails-section">
            <div class="thumbnails-title">Vidéos disponibles</div>
            <div class="thumbnails-grid" id="thumbnailsGrid"></div>
        </div>

        <footer>
            Ressources vidéo — Alexandre Bellotto · Cégep Limoilou, programme 574.C0
        </footer>
    </div>

    <script>
        const videos = [
            {ordre:1, titre:"Crane Partie supérieur P1", video_id:"aLAzKbbahgk"},
            {ordre:2, titre:"Crane Partie supérieur P2", video_id:"f8d0f-dbGiU"},
            {ordre:3, titre:"Crane Partie inférieure (mandibule) P2", video_id:"AS185CZqipg"},
            {ordre:4, titre:"Crane Partie inférieure Dents P2", video_id:"wFPg0X1xi0s"},
            {ordre:5, titre:"Ajuster le crane au reste du corps", video_id:"6AViSpMagJE"},
            {ordre:6, titre:"Crâne Contours extérieurs", video_id:"xSl_Y7fZkdk"},
            {ordre:7, titre:"Crâne Final", video_id:"D25nrYyNC4k"}
        ];

        const grid = document.getElementById('thumbnailsGrid');
        const player = document.getElementById('mainPlayer');
        const playerTitle = document.getElementById('playerTitle');
        const playerDuration = document.getElementById('playerDuration');

        videos.forEach((video, index) => {
            const card = document.createElement('div');
            card.className = 'thumbnail-card';
            if (index === 0) card.classList.add('active');
            
            card.innerHTML = `
                <div class="thumbnail-image">
                    <img src="https://img.youtube.com/vi/${video.video_id}/sddefault.jpg" alt="${video.titre}" onerror="this.src='https://img.youtube.com/vi/${video.video_id}/hqdefault.jpg'">
                    <div class="thumbnail-number">${video.ordre}</div>
                </div>
                <div class="thumbnail-info">
                    <div class="thumbnail-title">${video.titre}</div>
                </div>
            `;

            card.addEventListener('click', () => {
                player.src = `https://www.youtube.com/embed/${video.video_id}`;
                playerTitle.textContent = video.titre;
                playerDuration.textContent = `Vidéo ${video.ordre} / ${videos.length}`;
                
                document.querySelectorAll('.thumbnail-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
            });

            grid.appendChild(card);
        });
    </script>
</body>
</html>
