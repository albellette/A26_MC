<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Muscles — Ressources Vidéo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #1c1a19;
            color: #f0e9df;
            padding: 40px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 40px;
            border-bottom: 2px solid #948294;
            padding-bottom: 20px;
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            color: #f0e9df;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #9c8f88;
            font-size: 14px;
            font-weight: 400;
        }

        .player-section {
            margin-bottom: 50px;
            background: #2c2926;
            border: 1px solid #3a3532;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(148, 130, 148, 0.1);
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: #1c1a19;
            overflow: hidden;
        }

        .player-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-info {
            padding: 24px;
            background: #2c2926;
        }

        .player-title {
            font-size: 20px;
            font-weight: 700;
            color: #f0e9df;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .player-meta {
            font-size: 13px;
            color: #9c8f88;
            display: flex;
            gap: 20px;
        }

        .thumbnails-section {
            margin-top: 40px;
        }

        .thumbnails-title {
            font-size: 16px;
            font-weight: 700;
            color: #f0e9df;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .thumbnails-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }

        .thumbnail-card {
            cursor: pointer;
            background: #2c2926;
            border: 2px solid #3a3532;
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
        }

        .thumbnail-card:hover {
            border-color: #948294;
            box-shadow: 0 4px 12px rgba(148, 130, 148, 0.2);
            transform: translateY(-2px);
        }

        .thumbnail-card.active {
            border-color: #948294;
            background: #3a3532;
            box-shadow: 0 0 16px rgba(148, 130, 148, 0.3);
        }

        .thumbnail-image {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            overflow: hidden;
            background: #1c1a19;
        }

        .thumbnail-image img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumbnail-duration {
            position: absolute;
            bottom: 6px;
            right: 6px;
            background: rgba(0, 0, 0, 0.8);
            color: #f0e9df;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: 700;
            border-radius: 3px;
        }

        .thumbnail-number {
            position: absolute;
            top: 6px;
            left: 6px;
            background: #948294;
            color: #1c1a19;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
        }

        .thumbnail-info {
            padding: 12px;
            background: #2c2926;
        }

        .thumbnail-title {
            font-size: 11px;
            color: #f0e9df;
            font-weight: 600;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .nav-menu {
            display: flex;
            gap: 16px;
            margin-bottom: 40px;
            padding: 20px;
            background: #2c2926;
            border: 1px solid #3a3532;
            border-radius: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .nav-menu a {
            font-size: 12px;
            font-weight: 600;
            color: #9c8f88;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            transition: all 0.2s ease;
        }

        .nav-menu a:hover {
            color: #f0e9df;
            background: #3a3532;
        }

        .nav-menu a.active {
            color: #f0e9df;
            background: #948294;
            color: #1c1a19;
        }

        footer {
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid #3a3532;
            text-align: right;
            font-size: 11px;
            color: #6b645c;
        }

        @media (max-width: 768px) {
            .thumbnails-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 12px;
            }

            h1 {
                font-size: 24px;
            }

            .player-info {
                padding: 16px;
            }

            .player-title {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-menu">
            <a href="index.html">← Accueil</a>
            <a href="Squelette.html">Squelette</a>
            <a href="Liste_Crane.html">Crâne</a>
            <a href="Les_Muscles.html" class="active">Muscles</a>
            <a href="La_peau_et_finaliser_le_modele.html">Peau & Finalisation</a>
            <a href="La_topologie.html">Topologie</a>
            <a href="Projection_et_textures.html">Projection</a>
        </div>

        <header>
            <h1>Les Muscles</h1>
            <p class="subtitle">574-3X6-LI · Modèles de créatures · Cégep Limoilou</p>
        </header>

        <div class="player-section">
            <div class="player-wrapper">
                <iframe id="mainPlayer" width="560" height="315" src="https://www.youtube.com/embed/zixhszytH-s" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>
            <div class="player-info">
                <div class="player-title" id="playerTitle">MO2022 - B2 - 01 Ajuster le contact au sol</div>
                <div class="player-meta">
                    <span id="playerDuration">Durée : 0:54</span>
                </div>
            </div>
        </div>

        <div class="thumbnails-section">
            <div class="thumbnails-title">Sélectionne une vidéo</div>
            <div class="thumbnails-grid" id="thumbnailsGrid"></div>
        </div>

        <footer>
            Ressources vidéo — Alexandre Bellotto · Cégep Limoilou, programme 574.C0
        </footer>
    </div>

    <script>
        const videos = [
            {"ordre":1,"titre":"MO2022 - B2 - 01 Ajuster le contact au sol-","duree":"0:54","video_id":"zixhszytH-s","miniature":"https://img.youtube.com/vi/zixhszytH-s/hqdefault.jpg"},
            {"ordre":2,"titre":"MO2022 - B2 - 02 Fusion des subtools du squelette","duree":"0:59","video_id":"G3rvLyZsXIk","miniature":"https://img.youtube.com/vi/G3rvLyZsXIk/hqdefault.jpg"},
            {"ordre":3,"titre":"MO2022 - B2 - 03a la zone Abdominale et le cou Fusion des subtools du squelette","duree":"7:15","video_id":"oubxwJPwLMM","miniature":"https://img.youtube.com/vi/oubxwJPwLMM/hqdefault.jpg"},
            {"ordre":4,"titre":"MO2022 - B2 - 03b la zone Abdominale et le cou Fusion des subtools du squelette","duree":"8:02","video_id":"GtqW2u2WDl8","miniature":"https://img.youtube.com/vi/GtqW2u2WDl8/hqdefault.jpg"},
            {"ordre":5,"titre":"MO2022 - B2 - 03c la zone Abdominale et le cou Fusion des subtools du squelette","duree":"7:13","video_id":"CEPXbSD2Tz4","miniature":"https://img.youtube.com/vi/CEPXbSD2Tz4/hqdefault.jpg"},
            {"ordre":6,"titre":"MO2022 - B2 - 04a Les muscles de la tête-","duree":"7:28","video_id":"N4cOqdzlDoE","miniature":"https://img.youtube.com/vi/N4cOqdzlDoE/hqdefault.jpg"},
            {"ordre":7,"titre":"MO2022 - B2 - 04b Les muscles de la tête","duree":"4:20","video_id":"efkwAGtEWjU","miniature":"https://img.youtube.com/vi/efkwAGtEWjU/hqdefault.jpg"},
            {"ordre":8,"titre":"MO2022 - B2 - 05 - Les pattes avants","duree":"8:37","video_id":"KUL30azCeUA","miniature":"https://img.youtube.com/vi/KUL30azCeUA/hqdefault.jpg"},
            {"ordre":9,"titre":"MO2022 - B2 - 06a - Les pattes arrières","duree":"6:42","video_id":"6MV7C8odb6o","miniature":"https://img.youtube.com/vi/6MV7C8odb6o/hqdefault.jpg"},
            {"ordre":10,"titre":"MO2022 - B2 - 06b - Les pattes arrières","duree":"3:59","video_id":"y9jAf20wjxA","miniature":"https://img.youtube.com/vi/y9jAf20wjxA/hqdefault.jpg"},
            {"ordre":11,"titre":"MO2022 - B2 - 07 - Conclusion_1","duree":"1:34","video_id":"0FON3DkJ5eM","miniature":"https://img.youtube.com/vi/0FON3DkJ5eM/hqdefault.jpg"}
        ];

        const grid = document.getElementById('thumbnailsGrid');
        const player = document.getElementById('mainPlayer');
        const playerTitle = document.getElementById('playerTitle');
        const playerDuration = document.getElementById('playerDuration');

        videos.forEach((video, index) => {
            const card = document.createElement('div');
            card.className = 'thumbnail-card';
            if (index === 0) card.classList.add('active');
            
            card.innerHTML = `
                <div class="thumbnail-image">
                    <img src="${video.miniature}" alt="${video.titre}">
                    <div class="thumbnail-number">${video.ordre}</div>
                    <div class="thumbnail-duration">${video.duree}</div>
                </div>
                <div class="thumbnail-info">
                    <div class="thumbnail-title">${video.titre}</div>
                </div>
            `;

            card.addEventListener('click', () => {
                player.src = `https://www.youtube.com/embed/${video.video_id}`;
                playerTitle.textContent = video.titre;
                playerDuration.textContent = `Durée : ${video.duree}`;

                document.querySelectorAll('.thumbnail-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
            });

            grid.appendChild(card);
        });
    </script>
</body>
</html>
